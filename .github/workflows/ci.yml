# The gate: the whole tree -- the WinUI half included -- built and tested on
# the hosted Windows runner, Debug and Release side by side, with the tree's
# own flags and nothing else.
#
# The toolset is MSVC 14.53 from the Insiders channel's Build Tools, installed
# on each run: the image's 14.51 miscompiles a coroutine whose final_suspend()
# returns suspend_never in optimized /EHsc code (bugs/coro-report.md), and the
# /EHa that hides it breaks a death test that expects an access violation to
# take the process down. The same installation gets the workload "WinUI
# application development build tools" with "C++ WinUI app development build
# tools": the configure restores the NuGet packages and builds the cppwinrt
# projection with the MSBuild of that installation (cmake/wxl_packages.cmake).
#
# The WinUI half needs what the repository does not carry: the NuGet packages,
# the cppwinrt projection and the wrappers winui-srcgen writes into
# wxl.ui/src/wxl. The job produces them the way a fresh clone does: seed the
# wrapper directory with an empty CMakeLists.txt, configure (which restores the
# packages and builds the projection in the build directory), build the
# generator, run it with the full profile, configure again and build
# everything.
#
# A third row keeps the coroutine checks of wxl.async in the build
# (WXL_STRICT_CORO): the tests that expect a broken rule to stop the process
# with the line of the call are skipped by every other configuration, and
# only run here. It builds and tests the three programs of wxl.async/tests
# alone -- the checks live there, and the wrappers are not needed for them --
# so the generator, the second configure and the sample are left out.
#
# The rows build in the merge queue and on a run by hand, not on the pull
# request: the queue's candidate is what becomes main, so its run is the check
# that counts, and a second full build of the pull request alone, some 45
# minutes a row, only delayed it. The queue admits a pull request only when
# its required checks are green on its head, and the ruleset requires the
# rows by name, so on the pull request the windows-pr job reports the same
# three names at once, without building. The commits job and the docs site
# still check the pull request itself.
name: ci

# merge_group: the merge queue's candidate branch, main plus the queued pull
# requests, checked before it becomes main. edited: a new title or description
# of a pull request is checked again by the commits job, which reads them.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run moot. A queue
# candidate has a ref of its own, so one candidate does not cancel another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix rows and the name are those of windows-pr below: the expanded
  # names are the required checks of the ruleset, and the two jobs keep them
  # byte for byte the same. The job ids are not build on purpose: a job its
  # if skips has no matrix expanded and may be reported under its id, and an
  # id of build would put a check of that name beside the docs site's
  # required build.
  windows:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: x64-debug
          - config: Release
            preset: x64-release
          - config: Debug
            preset: x64-debug
            strict: true
    name: build (${{ matrix.strict && 'Strict' || matrix.config }})
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DEVCMD: C:\BuildToolsInsiders\Common7\Tools\VsDevCmd.bat
      VCVARS: -vcvars_ver=14.53
      # The restore of the configure, tools/install-runtime.ps1 and winui-srcgen
      # all read this variable first.
      NUGET_PACKAGES: C:\nuget-packages
      # MSBuild reads the environment variables as properties, so the restore of
      # the configure runs in locked mode: it resolves the versions that
      # tools/packages.lock.json records, and a lock file that does not match
      # the pins stops the configure instead of being rewritten. NuGet in
      # locked mode writes a lock file that is not there, so
      # cmake/wxl_packages.cmake stops a locked configure without one.
      RestoreLockedMode: true
    steps:
      - uses: actions/checkout@v4

      # 3010 is "installed, a reboot is pending": the compiler is usable as is.
      # One installation for the toolset and the WinUI build tools, so that
      # VsDevCmd of it gives both MSVC 14.53 and the MSBuild the configure runs.
      - name: Install MSVC 14.53 and the WinUI build tools
        shell: pwsh
        run: |
          $boot = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/insiders/vs_buildtools.exe' -OutFile $boot -UseBasicParsing
          $p = Start-Process -FilePath $boot -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru -ArgumentList @(
            '--installPath', 'C:\BuildToolsInsiders',
            '--add', 'Microsoft.VisualStudio.Component.VC.Preview.Tools.x86.x64',
            '--add', 'Microsoft.VisualStudio.Workload.UniversalBuildTools',
            '--add', 'Microsoft.VisualStudio.ComponentGroup.WindowsAppDevelopment.VC.BuildTools',
            '--quiet', '--wait', '--norestart', '--nocache')
          "exit code $($p.ExitCode)"
          Get-ChildItem 'C:\BuildToolsInsiders\VC\Tools\MSVC' | ForEach-Object { $_.Name }
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "Build Tools install failed: $($p.ExitCode)" }

      - name: Seed the wrapper directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wxl.ui\src\wxl | Out-Null
          New-Item -ItemType File wxl.ui\src\wxl\CMakeLists.txt | Out-Null

      # One shell for the developer environment and every CMake call: VsDevCmd
      # puts the toolset and Ninja on PATH, as tools/build.ps1 does at home.
      - name: Configure
        shell: cmd
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --preset x64 -DBUILD_TESTING=ON -DWXL_BUILD_DOCS=OFF ${{ matrix.strict && '-DWXL_STRICT_CORO=ON' || '' }}

      - name: Build winui-srcgen
        if: ${{ !matrix.strict }}
        shell: cmd
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --build build\x64 --config ${{ matrix.config }} --target winui-srcgen

      - name: Generate the wrappers
        if: ${{ !matrix.strict }}
        shell: cmd
        run: build\x64\wxl.gen\${{ matrix.config }}\winui-srcgen.exe --profile wxl.gen\profiles\full.json

      - name: Configure with the wrappers
        if: ${{ !matrix.strict }}
        shell: cmd
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --preset x64

      # -k 0: every compile error of the change at once, not only the first.
      - name: Build
        id: build
        shell: cmd
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --build build\x64 --config ${{ matrix.config }} ${{ matrix.strict && '--target wxl.async.tests wxl.async.dispatched-tests wxl.async.driven-tests' || '' }} -- -k 0

      # The strict row runs the tests of its own directory: the preset would list
      # every program of the tree, and the ones it did not build would fail.
      - name: Test
        shell: cmd
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          ctest ${{ matrix.strict && '--test-dir build\x64\wxl.async\tests -C Debug' || format('--preset {0}', matrix.preset) }} --output-on-failure --timeout 300 --output-junit ctest.xml

      # No test opens a WinUI window; a sample does. The experimental runtime
      # the wrappers ask for, from the installers the restore of the configure
      # put into the NuGet package folder, then the hello sample for twenty
      # seconds: it has to start and show its window on the runner's desktop.
      # After a red test step as well -- the two answer different questions --
      # but not after a red build, which left nothing to start.
      - name: Install the experimental Windows App Runtime
        if: (success() || failure()) && steps.build.outcome == 'success' && !matrix.strict
        shell: pwsh
        run: pwsh -NoProfile -File tools/install-runtime.ps1

      - name: Start a sample
        if: (success() || failure()) && steps.build.outcome == 'success' && !matrix.strict
        shell: pwsh
        run: |
          $exe = "build\x64\samples\HelloHere\${{ matrix.config }}\sample.hello.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $exe = Get-Item $exe
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { throw "sample.hello exited within 20 s, code $($p.ExitCode)" }
          $window = $p.MainWindowHandle
          "running after 20 s; main window handle $window, title '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id
          if ($window -eq 0) { throw 'sample.hello runs but shows no main window' }

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.strict && 'Strict' || matrix.config }}
          path: |
            build/x64/Testing/Temporary/
            build/x64/wxl.async/tests/Testing/Temporary/
            build/x64/ctest.xml
            build/x64/wxl.async/tests/ctest.xml
          if-no-files-found: ignore

  # The build rows on a pull request: the names the ruleset requires, green at
  # once, so that the merge queue admits the pull request and builds its
  # candidate (see the header). The rows and the name are those of windows.
  windows-pr:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: x64-debug
          - config: Release
            preset: x64-release
          - config: Debug
            preset: x64-debug
            strict: true
    name: build (${{ matrix.strict && 'Strict' || matrix.config }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build in the merge queue
        env:
          ROW: ${{ matrix.strict && 'Strict' || matrix.config }}
        run: echo "The $ROW build and its tests run in the merge queue, on the candidate that would become main."

  # Every commit of a pull request, and on a merge queue candidate the commit
  # the queue squashes a pull request into, is checked against the rules
  # CONTRIBUTING.md states; the maintainers run the same checks before they
  # push, and this job is the one that holds for everybody. The rules,
  # numbered as there:
  #   1. the author and the committer addresses are GitHub's private
  #      @users.noreply.github.com ones; the names are free and need not be
  #      equal. A commit GitHub makes itself -- the merge of "Update with
  #      merge commit" or of the "Resolve conflicts" editor, the squash of
  #      the merge queue -- is expected to carry the committer
  #      GitHub <noreply@github.com> and GitHub's signature. A committer of
  #      exactly GitHub <noreply@github.com> passes only with a signature,
  #      which rule 4 then holds to one GitHub verifies: a commit of
  #      GitHub's that comes unsigned fails here rather than passing unseen;
  #   2. none of these trailer lines in the message: Co-Authored-By (a commit
  #      has one author), banner lines, trailer lines that carry a link. The
  #      patterns are case-sensitive and anchored at the start of a line,
  #      with the colon or the bracket that follows the word: a body line
  #      that merely starts with the same words in lower case is prose, and
  #      so is a link inside a sentence. On a pull request its title and
  #      description are read the same way: the queue's squash takes them
  #      for its message, the title as the subject and the description as
  #      the body, and a fault there is better found before the queue;
  #   3. no hidden entry outside the list: a path component that starts with
  #      a dot is not part of the tree, except the hidden entries listed in
  #      the script below, which are exactly the ones the tree tracks. A bare
  #      entry, such as a symbolic link or a submodule at that path, counts
  #      as well; a new hidden entry is added to the list deliberately, in a
  #      change of its own. Only the paths a commit adds or changes are
  #      read: a hidden entry it deletes is one the tree stops tracking. A
  #      merge is read against its first parent, the branch: the paths that
  #      come from main are tracked already, and a hidden entry the
  #      resolution of a conflict adds is caught;
  #   4. a signed commit is one GitHub verifies: a key GitHub does not know
  #      makes an unverifiable commit, an unsigned one passes;
  #   5. a merge commit only of main into the branch: exactly two parents,
  #      the second of them a commit of main. That is how a branch behind
  #      main or in conflict with it catches up: by "Update with merge
  #      commit", in the "Resolve conflicts" editor, or by a merge by hand
  #      with the conflict resolved in it. A merge of another branch, of a
  #      commit main does not have, or of more than two parents is a fault.
  #      Rules 1 to 4 hold for a merge as for any other commit. The merge
  #      queue squashes a pull request into one commit, so a candidate
  #      brings no merge into main, and main stays linear.
  # Main is the main the checkout fetched -- fetch-depth 0 fetches every
  # branch -- not the base of the event: nothing promises that the base a
  # pull_request event carries is as new as the main the branch has merged,
  # while main only moves forward and the checkout comes after the push, so
  # the fetched main has every commit a branch could merge. The commits of
  # main a merge brings are left out of the range: main has them already.
  # A run by hand has no range of commits to check.
  commits:
    name: commits
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # The whole history of every branch: the range starts at the base and
      # at main, which a shallow clone of the pull request's merge ref does
      # not reach. The job pushes nothing, so no token stays in .git.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The event's values reach the shell as variables, never spliced into
      # the script, and are checked before anything uses them. The runner
      # reads the output line by line, a bare CR ending a line as well, and
      # takes a line that starts with "::" for a workflow command: a subject
      # or a title is printed after a word and with its line breaks turned
      # into spaces, so no part of it starts a line. A git command whose
      # output a loop reads is waited for, so that its failure is not taken
      # for an empty list.
      - name: Check the commits
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "::error::'$sha' is not a commit of this repository"
              exit 1
            fi
          done

          # The hidden entries the tree tracks (rule 3), as git ls-files lists
          # them; a component is compared whole, wherever it stands in a path.
          tracked_hidden=(.clang-format .gitattributes .github .gitignore)
          is_tracked_hidden() {
            local entry
            for entry in "${tracked_hidden[@]}"; do
              if [ "$1" = "$entry" ]; then
                return 0
              fi
            done
            return 1
          }

          # An annotation's text is URL-style encoded by the runner: % and the
          # line breaks are escaped so that a name cannot cut it short.
          faults=0
          fault() {
            local text="rule $1: $2"
            text=${text//'%'/'%25'}
            text=${text//$'\r'/'%0D'}
            text=${text//$'\n'/'%0A'}
            echo "::error title=$where::$text"
            faults=$((faults + 1))
          }

          # Rule 2 over a commit message, or over what the queue's squash
          # makes its message of.
          check_message() {
            if grep -qE '^(Co-Authored-By:|Co-authored-by:|🤖|Generated with \[)' <<< "$1"; then
              fault 2 "$2 carries a Co-Authored-By or a banner line"
            fi
            if grep -qE '^[A-Za-z]+(-[A-Za-z]+)*: https?://' <<< "$1"; then
              fault 2 "$2 carries a trailer line with a link"
            fi
          }

          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            where="pull request"
            title=${PR_TITLE//$'\r'/ }
            echo "pull request ${title//$'\n'/ }"
            check_message "$PR_TITLE"$'\n\n'"$PR_BODY" "the title or the description"
          fi

          if ! main_tip=$(git rev-parse --verify -q 'refs/remotes/origin/main^{commit}'); then
            echo "::error::main is not fetched"
            exit 1
          fi

          commits=$(git rev-list --reverse "$HEAD_SHA" --not "$BASE_SHA" "$main_tip")
          count=0
          for sha in $commits; do
            count=$((count + 1))
            short=$(git rev-parse --short "$sha")
            where="commit $short"
            subject=$(git log -1 --format=%s "$sha")
            echo "$short ${subject//$'\r'/ }"

            # The commit itself, then its parents.
            parent_line=$(git rev-list --parents -n 1 "$sha")
            read -ra parents <<< "$parent_line"
            merge=false
            if [ "${#parents[@]}" -gt 2 ]; then
              merge=true
            fi
            if [ "${#parents[@]}" -gt 3 ]; then
              fault 5 "a merge of $((${#parents[@]} - 1)) parents; only main is merged into a branch"
            elif [ "$merge" = true ]; then
              # 1: not an ancestor; anything else but 0: git could not tell.
              ancestor=0
              git merge-base --is-ancestor "${parents[2]}" "$main_tip" || ancestor=$?
              if [ "$ancestor" -eq 1 ]; then
                fault 5 "a merge of ${parents[2]}, which main does not have; only main is merged into a branch"
              elif [ "$ancestor" -ne 0 ]; then
                fault 5 "a merge of ${parents[2]}; git merge-base failed to tell whether main has it"
              fi
            fi

            # %ae and %cn, not %aE and %cN: the identity as recorded, without
            # a .mailmap in between.
            mapfile -t identity < <(git log -1 --format='%ae%n%cn%n%ce' "$sha")
            wait $! || { echo "::error::git log failed on commit $short"; exit 1; }
            author_email=${identity[0]-}
            committer_name=${identity[1]-}
            committer_email=${identity[2]-}

            # The signature is a header of the commit object: the headers end
            # at the first empty line, and a message line that starts with
            # gpgsig is not one.
            object=$(git cat-file commit "$sha")
            signed=false
            if grep -q '^gpgsig' <<< "${object%%$'\n\n'*}"; then
              signed=true
            fi

            if [[ "$author_email" != *@users.noreply.github.com ]]; then
              fault 1 "author <$author_email> is not a @users.noreply.github.com address"
            fi
            if [ "$committer_name" = "GitHub" ] && [ "$committer_email" = "noreply@github.com" ]; then
              if [ "$signed" != true ]; then
                fault 1 "committer GitHub <noreply@github.com> on a commit without a signature"
              fi
            elif [[ "$committer_email" != *@users.noreply.github.com ]]; then
              fault 1 "committer <$committer_email> is not a @users.noreply.github.com address"
            fi

            message=$(git log -1 --format=%B "$sha")
            check_message "$message" "the message"

            # -z: a path is printed as it is, not quoted; --diff-filter=d: no
            # deleted path; --root: the paths of a commit without a parent as
            # well; a merge against its first parent. The path is split on /
            # by parameter expansion, which keeps any other character in it.
            if [ "$merge" = true ]; then
              changed=(git diff-tree --no-commit-id --name-only -r -z --diff-filter=d "${parents[1]}" "$sha")
            else
              changed=(git diff-tree --no-commit-id --name-only -r -z --diff-filter=d --root "$sha")
            fi
            while IFS= read -r -d '' path; do
              rest=$path
              while :; do
                part=${rest%%/*}
                if [[ "$part" == .* ]] && ! is_tracked_hidden "$part"; then
                  fault 3 "$path: $part is a hidden entry the tree does not track"
                  break
                fi
                if [[ "$rest" != */* ]]; then
                  break
                fi
                rest=${rest#*/}
              done
            done < <("${changed[@]}")
            wait $! || { echo "::error::git diff-tree failed on commit $short"; exit 1; }

            if [ "$signed" = true ]; then
              if ! verified=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq .commit.verification.verified); then
                fault 4 "signed, and GitHub could not be asked whether it verifies the signature"
              elif [ "$verified" != "true" ]; then
                fault 4 "signed with a signature GitHub does not verify"
              fi
            fi
          done

          if [ "$count" -eq 0 ]; then
            echo "::error::no commits in $BASE_SHA..$HEAD_SHA that main does not have"
            exit 1
          fi
          if [ "$faults" -ne 0 ]; then
            echo "::error::$faults fault(s), $count commit(s) checked; the rules are in CONTRIBUTING.md"
            exit 1
          fi
          echo "$count commit(s), no faults"
